version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      testcontainers:
        patterns: ['Testcontainers*']
      xunit:
        patterns: ['xunit*']
  - package-ecosystem: npm
    directory: /NuntivusServer.Dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /NuntivusServer.Api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /NuntivusServer.Worker
    schedule:
      interval: weekly
