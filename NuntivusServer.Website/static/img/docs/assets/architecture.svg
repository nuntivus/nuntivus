<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Nuntivus runtime architecture</title>
  <desc id="description">HTTP sources enter through the API. Pull connectors run in the Worker. Both persist events and transactional outbox records in PostgreSQL. The Worker publishes the outbox to NATS JetStream, matches contracts, prepares and dispatches deliveries to customer destinations, and persists delivery state and attempts. The dashboard manages and queries the API. Processing is at least once.</desc>
  <defs>
	<linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c1425"/><stop offset="1" stop-color="#14243e"/></linearGradient>
	<linearGradient id="database" x2="1" y2="1"><stop stop-color="#173f65"/><stop offset="1" stop-color="#142b46"/></linearGradient>
	<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#78acff"/></marker>
	<marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#63d9bc"/></marker>
	<style>
	  text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf4ff} .eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#91baff} .heading{font-size:21px;font-weight:700} .body{font-size:15px;fill:#b5c6df} .label{font-size:13px;fill:#b5c6df} .node{fill:#18283f;stroke:#375171;stroke-width:1.5} .flow{fill:none;stroke:#78acff;stroke-width:2;marker-end:url(#arrow)} .state{fill:none;stroke:#63d9bc;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#green-arrow)}
	</style>
  </defs>
  <rect width="1200" height="900" rx="24" fill="url(#background)"/>
  <text x="44" y="46" class="eyebrow">NUNTIVUS / RUNTIME ARCHITECTURE</text>
  <text x="44" y="84" font-size="30" font-weight="700">Accept durably. Route independently. Deliver reliably.</text>
  <text x="44" y="113" class="body">Separate API and Worker processes. Shared durable state. Customer-specific delivery policies.</text>

  <rect x="44" y="148" width="220" height="112" rx="14" class="node"/>
  <text x="64" y="178" class="eyebrow">PRODUCERS</text><text x="64" y="209" class="heading">HTTP sources</text><text x="64" y="236" class="body">Business events</text>
  <rect x="328" y="148" width="340" height="112" rx="14" fill="#162f54" stroke="#578fe2" stroke-width="1.5"/>
  <text x="348" y="178" class="eyebrow">API PROCESS / .NET</text><text x="348" y="209" class="heading">Authenticate &amp; accept</text><text x="348" y="236" class="body">Normalize · Validate · Deduplicate</text>
  <path d="M264 204H326" class="flow"/>
  <rect x="822" y="148" width="334" height="112" rx="14" class="node"/>
  <text x="842" y="178" class="eyebrow">ADMINISTRATION</text><text x="842" y="209" class="heading">React dashboard</text><text x="842" y="236" class="body">Configuration &amp; delivery visibility</text>
  <path d="M822 204H670" class="flow"/><text x="698" y="191" class="label">Manage / query</text>

  <rect x="328" y="325" width="340" height="137" rx="16" fill="url(#database)" stroke="#63d9bc" stroke-width="1.5"/>
  <text x="348" y="355" class="eyebrow" style="fill:#7de4cd">POSTGRESQL / SOURCE OF TRUTH</text>
  <text x="348" y="388" class="heading">Events + transactional outbox</text><text x="348" y="416" class="body">Contracts · Delivery state · Attempts</text><text x="348" y="442" class="label">One transaction for event acceptance</text>
  <path d="M498 260V323" class="flow"/><text x="512" y="296" class="label">Commit</text>

  <rect x="44" y="302" width="220" height="486" rx="18" fill="#101f33" stroke="#47648a" stroke-dasharray="6 5"/>
  <text x="64" y="333" class="eyebrow">WORKER / INGESTION</text>
	<rect x="62" y="356" width="184" height="88" rx="12" class="node"/><text x="78" y="388" class="heading">Pull connectors</text><text x="78" y="416" class="body">Accept, then ack</text>
  <path d="M246 393H326" class="flow"/>
  <text x="64" y="489" class="label">External message sources</text>
  <path d="M154 524V446" class="flow"/>
  <rect x="62" y="526" width="184" height="113" rx="12" class="node"/><text x="82" y="559" class="body">Kafka · RabbitMQ</text><text x="82" y="590" class="body">NATS · Amazon SQS</text><text x="82" y="618" class="label">Connector-specific limits</text>
  <text x="64" y="698" class="label">Progress advances only</text><text x="64" y="720" class="label">after durable acceptance.</text>

  <rect x="716" y="302" width="440" height="486" rx="18" fill="#101f33" stroke="#47648a" stroke-dasharray="6 5"/>
  <text x="738" y="333" class="eyebrow">WORKER / PROCESSING</text>
  <rect x="742" y="356" width="388" height="76" rx="12" class="node"/><text x="762" y="388" class="heading">Outbox publisher</text><text x="762" y="414" class="body">Publish committed asynchronous work</text>
  <path d="M668 393H740" class="flow"/>
  <path d="M936 432V455H498V499" class="flow"/>
  <text x="506" y="486" class="label">Publish</text>
  <rect x="328" y="501" width="340" height="92" rx="14" fill="#262741" stroke="#a296ed" stroke-width="1.5"/>
  <text x="348" y="535" class="heading">NATS JetStream</text><text x="348" y="565" class="body">Durable asynchronous work distribution</text>
  <path d="M668 547H740" class="flow"/>
  <rect x="742" y="490" width="388" height="112" rx="12" class="node"/><text x="762" y="523" class="heading">Match customer contracts</text><text x="762" y="551" class="body">Filter · Select schema · Transform</text><text x="762" y="578" class="label">Prepare &amp; persist customer deliveries</text>
  <path d="M936 602V634" class="flow"/>
  <rect x="742" y="636" width="388" height="121" rx="12" class="node"/><text x="762" y="670" class="heading">Dispatch &amp; recover deliveries</text><text x="762" y="700" class="body">Retry · Rate limits · Ordering policies</text><text x="762" y="730" class="label">Scheduled work · Attempts · Recovery</text>
  <path d="M742 706H694V439H670" class="state"/>
  <text x="340" y="647" class="label" style="fill:#7de4cd">DASHED GREEN = PERSISTED STATE</text>
  <text x="340" y="677" class="body">Delivery results and retry schedules</text><text x="340" y="701" class="body">are recorded in PostgreSQL.</text>
  <path d="M936 757V819H670" class="flow"/>
  <rect x="328" y="776" width="340" height="84" rx="14" fill="#173b36" stroke="#63d9bc" stroke-width="1.5"/>
  <text x="348" y="809" class="heading">Customer destinations</text><text x="348" y="838" class="body">HTTP · Kafka · RabbitMQ · NATS · SQS</text>
  <text x="44" y="851" class="label">AT-LEAST-ONCE PROCESSING</text><text x="44" y="875" class="label">Consumers must tolerate duplicates.</text>
</svg>
