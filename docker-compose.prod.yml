services:
  postgres:
    image: ${NUNTIVUS_POSTGRES_IMAGE}
    container_name: nuntivus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NUNTIVUS_POSTGRES_DB}
      POSTGRES_USER: ${NUNTIVUS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NUNTIVUS_POSTGRES_PASSWORD}
    ports:
      - "${NUNTIVUS_POSTGRES_PORT}:5432"
    volumes:
      - nuntivus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NUNTIVUS_POSTGRES_USER} -d ${NUNTIVUS_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nats:
    image: ${NUNTIVUS_NATS_IMAGE}
    container_name: nuntivus-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NUNTIVUS_NATS_CLIENT_PORT}:4222"
      - "${NUNTIVUS_NATS_MONITOR_PORT}:8222"
    volumes:
      - nuntivus-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: nuntivus-api:${NUNTIVUS_IMAGE_TAG}
    container_name: nuntivus-migrate
    restart: "no"
    build:
      context: .
      dockerfile: NuntivusServer.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${NUNTIVUS_ENVIRONMENT}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${NUNTIVUS_POSTGRES_DB};Username=${NUNTIVUS_POSTGRES_USER};Password=${NUNTIVUS_POSTGRES_PASSWORD}
      Database__PostgresConnectionString: Host=postgres;Port=5432;Database=${NUNTIVUS_POSTGRES_DB};Username=${NUNTIVUS_POSTGRES_USER};Password=${NUNTIVUS_POSTGRES_PASSWORD}
      DatabaseMigrations__Mode: Apply
      DestinationCredentials__EncryptionKey: ${NUNTIVUS_DESTINATION_CREDENTIALS_KEY}
    command: ["--migrate"]

  api:
    image: nuntivus-api:${NUNTIVUS_IMAGE_TAG}
    container_name: nuntivus-api
    build:
      context: .
      dockerfile: NuntivusServer.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${NUNTIVUS_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${NUNTIVUS_POSTGRES_DB};Username=${NUNTIVUS_POSTGRES_USER};Password=${NUNTIVUS_POSTGRES_PASSWORD}
      DestinationCredentials__EncryptionKey: ${NUNTIVUS_DESTINATION_CREDENTIALS_KEY}
      HostOptions__ShutdownTimeout: 00:00:${NUNTIVUS_SHUTDOWN_TIMEOUT_SECONDS}
    ports:
      - "${NUNTIVUS_API_PORT}:8080"
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: nuntivus-worker:${NUNTIVUS_IMAGE_TAG}
    container_name: nuntivus-worker
    build:
      context: .
      dockerfile: NuntivusServer.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: ${NUNTIVUS_ENVIRONMENT}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${NUNTIVUS_POSTGRES_DB};Username=${NUNTIVUS_POSTGRES_USER};Password=${NUNTIVUS_POSTGRES_PASSWORD}
      Nats__Url: ${NUNTIVUS_NATS_URL}
      Nats__Stream: ${NUNTIVUS_NATS_STREAM}
      Nats__Subjects__0: event.>
      Nats__Subjects__1: delivery.>
      DestinationCredentials__EncryptionKey: ${NUNTIVUS_DESTINATION_CREDENTIALS_KEY}
      OpenTelemetry__OtlpEndpoint: ${NUNTIVUS_OTLP_ENDPOINT}
      HostOptions__ShutdownTimeout: 00:00:${NUNTIVUS_SHUTDOWN_TIMEOUT_SECONDS}
    stop_grace_period: 40s

volumes:
  nuntivus-postgres-data:
  nuntivus-nats-data:
