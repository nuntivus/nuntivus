services:
  postgres:
    image: ${NUNTIVUS_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NUNTIVUS_POSTGRES_DB}
      POSTGRES_USER: ${NUNTIVUS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NUNTIVUS_POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - nuntivus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NUNTIVUS_POSTGRES_USER} -d ${NUNTIVUS_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nats:
    image: ${NUNTIVUS_NATS_IMAGE}
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nuntivus-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: nuntivus-api:${NUNTIVUS_IMAGE_TAG}
    pull_policy: never
    restart: "no"
    build:
      context: .
      dockerfile: NuntivusServer.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${NUNTIVUS_ENVIRONMENT}
      Database__PostgresConnectionString: Host=postgres;Port=5432;Database=${NUNTIVUS_POSTGRES_DB};Username=${NUNTIVUS_POSTGRES_USER};Password=${NUNTIVUS_POSTGRES_PASSWORD}
      DatabaseMigrations__Mode: Apply
      DestinationCredentials__EncryptionKey: ${NUNTIVUS_DESTINATION_CREDENTIALS_KEY:?Set a base64 32-byte encryption key}
    command: ["--migrate"]

  api:
    image: nuntivus-api:${NUNTIVUS_IMAGE_TAG}
    pull_policy: never
    build:
      context: .
      dockerfile: NuntivusServer.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${NUNTIVUS_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      Database__PostgresConnectionString: Host=postgres;Port=5432;Database=${NUNTIVUS_POSTGRES_DB};Username=${NUNTIVUS_POSTGRES_USER};Password=${NUNTIVUS_POSTGRES_PASSWORD}
      DatabaseMigrations__Mode: Validate
      DestinationCredentials__EncryptionKey: ${NUNTIVUS_DESTINATION_CREDENTIALS_KEY:?Set a base64 32-byte encryption key}
      LocalAuth__Enabled: ${NUNTIVUS_LOCAL_AUTH_ENABLED:-true}
      LocalAuth__SigningKey: ${NUNTIVUS_LOCAL_AUTH_SIGNING_KEY:-}
      Authentication__Authority: ${NUNTIVUS_AUTHORITY:-}
      Authentication__Audience: ${NUNTIVUS_AUDIENCE:-}
      ReverseProxy__KnownProxies__0: ${NUNTIVUS_PROXY_IP:-127.0.0.1}
      ReverseProxy__HttpsPort: ${NUNTIVUS_HTTPS_PORT:-443}
      HostOptions__ShutdownTimeout: 00:00:${NUNTIVUS_SHUTDOWN_TIMEOUT_SECONDS}
    ports:
      - "127.0.0.1:${NUNTIVUS_API_PORT}:8080"
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: nuntivus-worker:${NUNTIVUS_IMAGE_TAG}
    pull_policy: never
    build:
      context: .
      dockerfile: NuntivusServer.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: ${NUNTIVUS_ENVIRONMENT}
      Database__PostgresConnectionString: Host=postgres;Port=5432;Database=${NUNTIVUS_POSTGRES_DB};Username=${NUNTIVUS_POSTGRES_USER};Password=${NUNTIVUS_POSTGRES_PASSWORD}
      DatabaseMigrations__Mode: Validate
      Nats__Url: ${NUNTIVUS_NATS_URL}
      Nats__Stream: ${NUNTIVUS_NATS_STREAM}
      Nats__Subjects__0: event.>
      Nats__Subjects__1: delivery.>
      DestinationCredentials__EncryptionKey: ${NUNTIVUS_DESTINATION_CREDENTIALS_KEY:?Set a base64 32-byte encryption key}
      OpenTelemetry__OtlpEndpoint: ${NUNTIVUS_OTLP_ENDPOINT}
      HostOptions__ShutdownTimeout: 00:00:${NUNTIVUS_SHUTDOWN_TIMEOUT_SECONDS}
    stop_grace_period: 40s

volumes:
  nuntivus-postgres-data:
  nuntivus-nats-data:
