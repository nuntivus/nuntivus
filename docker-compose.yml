services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nuntivus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nuntivus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nuntivus"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    # -js enables JetStream, -sd points to the persistent store, -m exposes monitoring.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring
    volumes:
      - nuntivus-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    pull_policy: never
    build:
      context: .
      dockerfile: NuntivusServer.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__PostgresConnectionString: "Host=postgres;Port=5432;Database=nuntivus;Username=postgres;Password=postgres"
    command: ["--migrate"]
    restart: "no"

  api:
    pull_policy: never
    build:
      context: .
      dockerfile: NuntivusServer.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__PostgresConnectionString: "Host=postgres;Port=5432;Database=nuntivus;Username=postgres;Password=postgres"
      DatabaseMigrations__Mode: Validate
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    pull_policy: never
    build:
      context: .
      dockerfile: NuntivusServer.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      Database__PostgresConnectionString: "Host=postgres;Port=5432;Database=nuntivus;Username=postgres;Password=postgres"
      DatabaseMigrations__Mode: Validate
      Nats__Url: "nats://nats:4222"
      Nats__Stream: "NUNTIVUS_EVENTS"
      Nats__Subjects__0: event.>
      Nats__Subjects__1: delivery.>

volumes:
  nuntivus-postgres-data:
  nuntivus-nats-data:
